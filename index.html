<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BT100-2J Pump Panel (Bluetooth)</title>
<style>
:root{--bg:#e8eef0;--card:#fff;--ink:#12262e;--mute:#587079;--line:#d0dce0;--acc:#0b7a8c;--go:#1c9a52;--stop:#d24545;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1f;--card:#15262d;--ink:#e6f0f3;--mute:#8ba3ac;--line:#2a3f48;--acc:#3bb8cb;--go:#3ccf7a;--stop:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:460px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.chip.ok{color:var(--go);border-color:var(--go)}.chip.bad{color:var(--stop);border-color:var(--stop)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:600}
.big{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.big{display:flex;justify-content:center;align-items:baseline}
.big small{font-size:20px;color:var(--mute);font-weight:500;margin-left:6px}
.big input{font:inherit;color:inherit;width:5.6ch;text-align:center;background:transparent;border:0;border-bottom:3px dotted var(--line);border-radius:0;padding:0;-moz-appearance:textfield;appearance:textfield}
.big input::-webkit-outer-spin-button,.big input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.big input:focus{outline:none;border-bottom:3px solid var(--acc)}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 0}
.row{display:flex;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;min-height:48px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled,input:disabled{opacity:.45;cursor:not-allowed}
.fine{width:52px;font-size:22px;padding:0}
input[type=range]{flex:1;height:44px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid var(--acc);margin-top:-11px;box-shadow:0 1px 4px #0004}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:0 60px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#conn{width:100%;font-weight:600;color:#fff;background:var(--acc);border-color:var(--acc)}
#conn.off{background:var(--card);color:var(--ink);border-color:var(--line)}
#go{width:100%;font-size:20px;font-weight:700;min-height:64px;color:#fff;background:var(--go);border-color:var(--go)}
#go.running{background:var(--stop);border-color:var(--stop)}
#status,#note{text-align:center;color:var(--mute);margin:10px 0 0;min-height:22px}
#note{font-size:14px;margin:0}
.tin{display:flex;align-items:center;gap:6px}
.tin input{width:76px;font:inherit;font-size:22px;padding:8px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .9s linear}
#left{font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin-top:10px}
</style></head><body><main>
<header><h1>BT100-2J Pump Panel</h1><span id="link" class="chip">Not connected</span></header>
<button id="conn">Connect</button>
<p id="note"></p>

<section class="card"><h2>Speed</h2>
<div class="big"><input id="rpmv" type="number" inputmode="decimal" step="0.1" min="0.1" max="100" value="10.0" aria-label="Type an exact speed in rpm"><small>rpm</small></div>
<p class="hint">Tap the number to type an exact speed (0.1 to 100)</p>
<div class="row" style="margin-top:12px">
<button class="fine" id="minus" aria-label="Decrease 0.1 rpm">−</button>
<input type="range" id="rpm" min="1" max="1000" value="100" aria-label="Pump speed in rpm">
<button class="fine" id="plus" aria-label="Increase 0.1 rpm">+</button></div>
<div class="ends"><span>0.1</span><span>100</span></div></section>

<section class="card"><h2>Direction</h2>
<div class="seg"><button id="cw">↻ Clockwise</button><button id="ccw">↺ Counter-clockwise</button></div></section>

<section class="card"><h2>Run</h2>
<button id="go">Start</button><p id="status">Stopped</p>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
<h2>Run for a set time, then stop</h2>
<div class="row" style="justify-content:space-between">
<div class="tin"><input id="tm" type="number" min="0" max="999" value="1" aria-label="Minutes">min
<input id="ts" type="number" min="0" max="59" value="0" aria-label="Seconds">sec</div>
<button id="tbtn">Start timer</button></div>
<div id="tinfo" hidden><div id="left">00:00</div><div class="bar"><i id="fill"></i></div></div></section>
</main>
<script>
const SVC='b7a10001-5a1e-4c2e-9a3b-0b100e2f0001',CMD='b7a10001-5a1e-4c2e-9a3b-0b100e2f0002',ST='b7a10001-5a1e-4c2e-9a3b-0b100e2f0003';
const $=id=>document.getElementById(id);
const S={rpm:10,cw:true,run:false,left:0,total:0,link:false};
let dev=null,cmdC=null,online=false,drag=false,q=Promise.resolve(),rpmBusy=false,rpmNext=null;
const enc=new TextEncoder();

function tx(t){q=q.then(()=>cmdC.writeValue(enc.encode(t))).catch(()=>{});return q}
function sendRpm(){
  if(!online)return;
  rpmNext=Math.round(S.rpm*10);
  if(rpmBusy)return;
  rpmBusy=true;
  (async()=>{while(rpmNext!==null){const v=rpmNext;rpmNext=null;await tx('S '+v)}rpmBusy=false})();
}
function onStatus(e){
  const d=e.target.value,f=d.getUint8(2);
  if(!drag)S.rpm=d.getUint16(0)/10;
  S.run=!!(f&1);S.cw=!!(f&2);S.link=!!(f&4);
  S.left=d.getUint32(4);S.total=d.getUint32(8);
  render();
}
function onLost(){
  const was=online;online=false;cmdC=null;
  if(was)$('note').textContent='Connection lost. The ESP32 stops a run without a timer; a timed run finishes by itself.';
  render();
}
async function connect(){
  if(dev&&dev.gatt.connected){dev.gatt.disconnect();return}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',onLost);
    $('link').textContent='Connecting…';$('link').className='chip';
    const srv=await dev.gatt.connect(),svc=await srv.getPrimaryService(SVC);
    cmdC=await svc.getCharacteristic(CMD);
    const st=await svc.getCharacteristic(ST);
    st.addEventListener('characteristicvaluechanged',onStatus);
    await st.startNotifications();
    online=true;$('note').textContent='';
    onStatus({target:{value:await st.readValue()}});
  }catch(e){
    online=false;
    if(e.name!=='NotFoundError')$('note').textContent='Could not connect: '+e.message;
    render();
  }
}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function render(){
  if(document.activeElement!==$('rpmv'))$('rpmv').value=S.rpm.toFixed(1);
  if(!drag)$('rpm').value=Math.round(S.rpm*10);
  $('rpm').style.setProperty('--p',((S.rpm*10-1)/999*100)+'%');
  $('cw').classList.toggle('on',S.cw);$('ccw').classList.toggle('on',!S.cw);
  const go=$('go');go.textContent=S.run?'Stop':'Start';go.classList.toggle('running',S.run);
  const dir=S.cw?'clockwise':'counter-clockwise';
  $('status').textContent=!S.run?'Stopped':S.left>0?`Running ${dir} at ${S.rpm.toFixed(1)} rpm, stops in ${mmss(S.left)}`:`Running ${dir} at ${S.rpm.toFixed(1)} rpm`;
  const timing=S.run&&S.left>0;
  $('tinfo').hidden=!timing;$('tbtn').disabled=timing||!online;
  $('left').textContent=mmss(S.left);
  $('fill').style.width=S.total?((S.total-S.left)/S.total*100)+'%':'0';
  for(const id of['rpmv','rpm','minus','plus','cw','ccw','go','tm','ts'])$(id).disabled=!online;
  const c=$('conn');c.textContent=online?'Disconnect':'Connect';c.classList.toggle('off',online);
  const l=$('link');
  if(!online){l.textContent='Not connected';l.className='chip bad'}
  else if(!S.link){l.textContent='Pump not answering';l.className='chip bad'}
  else{l.textContent='Pump connected';l.className='chip ok'}
}
const rpm=$('rpm');
rpm.addEventListener('input',()=>{drag=true;S.rpm=rpm.value/10;render();sendRpm()});
rpm.addEventListener('change',()=>{drag=false;sendRpm()});
function nudge(d){S.rpm=Math.min(100,Math.max(0.1,Math.round(S.rpm*10+d)/10));render();sendRpm()}
const rv=$('rpmv');
rv.addEventListener('focus',()=>rv.select());
rv.addEventListener('keydown',e=>{if(e.key==='Enter')rv.blur()});
rv.addEventListener('change',()=>{
  const v=parseFloat(rv.value);
  if(!isNaN(v)){S.rpm=Math.min(100,Math.max(0.1,Math.round(v*10)/10));sendRpm()}
  render();
});
rv.addEventListener('blur',render);
$('minus').onclick=()=>nudge(-1);$('plus').onclick=()=>nudge(1);
$('cw').onclick=()=>{S.cw=true;render();tx('D 1')};
$('ccw').onclick=()=>{S.cw=false;render();tx('D 0')};
$('go').onclick=()=>tx('R '+(S.run?0:1));
$('tbtn').onclick=()=>{
  const t=Math.min(999,Math.max(0,+$('tm').value||0))*60+Math.min(59,Math.max(0,+$('ts').value||0));
  if(t<1){$('status').textContent='Enter a time longer than 0 seconds';return}
  tx('T '+t);
};
$('conn').onclick=connect;
if(!navigator.bluetooth){
  $('conn').disabled=true;
  $('note').textContent='This browser has no Web Bluetooth. Use Chrome or Edge (PC, Android), or the Bluefy app on iPhone.';
}
render();
</script></body></html>
